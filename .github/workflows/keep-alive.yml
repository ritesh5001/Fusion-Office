# Backup keep-alive for the free Render plan (it sleeps after 15 min idle).
# The server also pings itself every 13 min (server/src/lib/keepAlive.ts);
# this wakes it from outside if it ever does fall asleep. GitHub runs
# schedules on a best-effort basis, so runs can start a few minutes late.
# To ping other URLs, set a repository variable KEEP_ALIVE_URLS
# (Settings → Secrets and variables → Actions → Variables), space-separated.
name: Keep Render awake

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health checks
        env:
          URLS: ${{ vars.KEEP_ALIVE_URLS || 'https://fusion-office.onrender.com/api/health' }}
        run: |
          status=0
          for url in $URLS; do
            # A sleeping instance takes up to a minute to start, hence the long timeout.
            if curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null -w "$url %{http_code} %{time_total}s\n" "$url"; then
              :
            else
              echo "::warning::$url did not answer"
              status=1
            fi
          done
          exit $status
