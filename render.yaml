# Render Blueprint: backend (with a persistent disk for PDFs), frontend and
# PostgreSQL. In the Render dashboard: New → Blueprint → pick this repo.
# Singapore is the closest Render region to India.

databases:
  - name: fusion-office-db
    databaseName: fusion_office
    user: fusion_office
    region: singapore
    plan: 0.1c-256mb

services:
  # ── Backend: API, Auth.js, file storage ──────────────────────────
  - type: web
    # Same name as the backend already running at fusion-office.onrender.com.
    name: fusion-office
    # Docker, because the converters need LibreOffice and Chromium installed.
    # The image applies database migrations, then starts the API.
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    region: singapore
    # Persistent disks need a paid instance (free instances have no disk).
    # LibreOffice and Chromium are memory hungry: 512 MB handles one
    # conversion at a time; choose a 2 GB plan for heavier use.
    plan: 0.5c-512mb
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
        - .dockerignore
    disk:
      name: files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fusion-office-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/files
      - key: MAX_UPLOAD_MB
        value: "200"
      # The public SITE (frontend) address + /api/auth, e.g. https://fusion-office-web.onrender.com/api/auth
      - key: AUTH_URL
        sync: false
      # Extra allowed origins, comma-separated (custom domains). Optional.
      - key: CLIENT_ORIGIN
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      # Turns on the AI tools (Summarize, Translate, Chat with PDF). Get a key at console.groq.com/keys.
      - key: GROQ_API_KEY
        sync: false
      # Optional: a different Groq model (default openai/gpt-oss-120b).
      - key: AI_MODEL
        sync: false
      - key: CONVERT_CONCURRENCY
        value: "1"
      - key: HTML_CONCURRENCY
        value: "1"

  # ── Frontend: Next.js site + editor; proxies /api/* to the backend ──
  - type: web
    name: fusion-office-web
    runtime: node
    region: singapore
    # Free works: free services can call the backend over the private network.
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w client
    startCommand: npm run start -w client
    healthCheckPath: /
    buildFilter:
      paths:
        - client/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Backend's private-network address (host:port); read by next.config.ts.
      - key: SERVER_HOSTPORT
        fromService:
          type: web
          name: fusion-office
          property: hostport
